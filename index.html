<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/otto-icon-192.png?v=1" />
    <link rel="manifest" href="/manifest.webmanifest?v=18" />
    <link rel="apple-touch-icon" href="/otto-icon-512.png?v=1" />
    <link rel="preload" as="image" href="/otto/otto-home-documents.webp?v=2" type="image/webp" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e8" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Отто A1" />
    <meta name="description" content="Тренажёр для подготовки к Goethe-Zertifikat A1" />
    <title>Тренажёр Отто — Goethe A1</title>
    <style>
      :root, html, body, #root { min-height: 100%; margin: 0; background: #f7f1e8; color-scheme: light; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script defer src="/otto-ui-experiment.js?v=3"></script>
    <script defer src="/otto-speech.js?v=4"></script>
    <script>
      // Real viewport height fallback for old browsers without `dvh` support
      // (e.g. some Android WebViews) so the app never overflows the screen.
      (function () {
        function setVh() {
          document.documentElement.style.setProperty('--otto-vh', window.innerHeight + 'px');
        }
        setVh();
        window.addEventListener('resize', setVh);
        window.addEventListener('orientationchange', setVh);
      })();
    </script>
    <script>
      // Permanently retire all legacy PWA workers/caches from earlier Otto builds.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) { registration.unregister(); });
        }).catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.filter(function (key) { return key.indexOf('otto-a1-') === 0; })
            .forEach(function (key) { caches.delete(key); });
        }).catch(function () {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
