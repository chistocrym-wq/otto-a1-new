name: Visual Preview Check

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: task/master-roadmap-final-46-52
          fetch-depth: 0
      - name: Apply requested recorder and mock-exam fixes
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          recorder = Path('src/components/sprechen/VoiceRecorder.tsx')
          text = recorder.read_text(encoding='utf-8')
          old = "  const resultReportedRef=useRef(false);\n\n  const clearTimer=useCallback"
          new = "  const resultReportedRef=useRef(false);\n  const evaluationKey=JSON.stringify(evaluation);\n  const previousEvaluationKeyRef=useRef(evaluationKey);\n\n  const clearTimer=useCallback"
          if old not in text:
              raise SystemExit('VoiceRecorder state marker not found')
          text = text.replace(old, new, 1)
          old = "  },[clearTimer]);\n\n  const acceptBlob=useCallback"
          new = "  },[clearTimer]);\n\n  useEffect(()=>{\n    if(previousEvaluationKeyRef.current===evaluationKey)return;\n    previousEvaluationKeyRef.current=evaluationKey;\n    reset();\n  },[evaluationKey,reset]);\n\n  const acceptBlob=useCallback"
          if old not in text:
              raise SystemExit('VoiceRecorder effect marker not found')
          recorder.write_text(text.replace(old, new, 1), encoding='utf-8')

          mock = Path('src/components/MockExam.tsx')
          text = mock.read_text(encoding='utf-8')
          old = "import { speakingTeil3ArchiveCards } from '@/data/speakingTeil3Archive';"
          new = old + "\nimport { Teil3ArchiveImage } from '@/components/sprechen/Teil3ArchiveImage';"
          if old not in text:
              raise SystemExit('MockExam import marker not found')
          text = text.replace(old, new, 1)
          stale = '<p className="mt-2 text-xs leading-5 text-slate-500">Новый пользовательский архив визуалов Teil 3 ещё не загружен, поэтому в пробнике используется нейтральная текстовая карточка объекта — старые картинки другого стиля не возвращаются.</p>'
          if stale not in text:
              raise SystemExit('MockExam stale Teil 3 note not found')
          text = text.replace(stale, '', 1)
          marker = '<p className="text-xs font-black uppercase text-amber-700">Karte {i+1}</p><h3 className="mt-2 text-2xl font-black">{card.alt}</h3>'
          replacement = '<p className="text-xs font-black uppercase text-amber-700">Karte {i+1}</p><Teil3ArchiveImage imageIndex={card.imageIndex} alt={card.alt} className="mx-auto mt-3 w-full max-w-xs rounded-xl"/><h3 className="mt-2 text-2xl font-black">{card.alt}</h3>'
          if marker not in text:
              raise SystemExit('MockExam Teil 3 card marker not found')
          mock.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/apply-user-point-fixes.yml
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build app
        run: npm run build
      - name: Commit requested recorder and mock-exam fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/sprechen/VoiceRecorder.tsx src/components/MockExam.tsx .github/workflows/apply-user-point-fixes.yml
          git commit -m "Reset Sprechen recordings and restore mock exam cards"
          git push origin HEAD:task/master-roadmap-final-46-52
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact Netlify Deploy Preview
        env:
          TARGET_URL: https://deploy-preview-17--otto-a1-new.netlify.app
          EXPECTED_QA_VERSION: otto-roadmap-final-20260914-v4-teil3
        run: |
          for i in {1..72}; do
            actual="$(curl -fsSL --max-time 12 "$TARGET_URL/qa-version.txt?attempt=$i" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$actual" = "$EXPECTED_QA_VERSION" ]; then
              echo "TARGET_URL=$TARGET_URL" >> "$GITHUB_ENV"
              echo "Exact marked Deploy Preview ready: $TARGET_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for exact marked Netlify preview"
          exit 1
      - name: Run focused Teil 3 QA v5
        env:
          QA_OUT: qa-artifacts-v5
        run: node scripts/qa-teil3-final-v5.mjs
      - name: Upload Teil 3 QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otto-teil3-final-qa-v5
          path: qa-artifacts-v5
          retention-days: 3
