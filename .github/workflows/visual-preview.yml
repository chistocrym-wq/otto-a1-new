name: Visual Preview Check

on:
  push:
    branches:
      - feature/sprechen-lesen-content-refresh-v2

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install app
        run: npm install
      - name: Build app
        run: npm run build
      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/otto-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/otto-preview.log
          exit 1
      - name: Capture approved viewport
        run: |
          npx --yes playwright@1.55.0 screenshot --viewport-size="390,693" --wait-for-timeout=8000 http://127.0.0.1:4173 visual-home.png
          npx --yes playwright@1.55.0 screenshot --full-page --wait-for-timeout=1000 http://127.0.0.1:4173/asset-check.html asset-check.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: otto-approved-home-visual
          path: |
            visual-home.png
            asset-check.png
          retention-days: 1
