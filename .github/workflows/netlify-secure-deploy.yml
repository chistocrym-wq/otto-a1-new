name: Secure one-time Netlify deploy

on:
  push:
    paths:
      - '.github/workflows/netlify-secure-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate ephemeral encryption key
        run: |
          set -euo pipefail
          mkdir -p .deploy /tmp/netlify-secure
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/netlify-secure/private.pem
          openssl pkey -in /tmp/netlify-secure/private.pem -pubout -out .deploy/public.pem
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/public.pem
          git commit -m "Publish ephemeral Netlify deploy public key"
          git push origin HEAD:main

      - name: Wait for encrypted Netlify proxy
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            git fetch -q origin main
            if git cat-file -e origin/main:.deploy/proxy-key.enc.b64 2>/dev/null && git cat-file -e origin/main:.deploy/proxy-data.enc.b64 2>/dev/null; then
              git show origin/main:.deploy/proxy-key.enc.b64 > /tmp/netlify-secure/proxy-key.enc.b64
              git show origin/main:.deploy/proxy-data.enc.b64 > /tmp/netlify-secure/proxy-data.enc.b64
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for encrypted deploy credentials" >&2
          exit 1

      - name: Decrypt proxy and deploy
        run: |
          set -euo pipefail
          base64 -d /tmp/netlify-secure/proxy-key.enc.b64 > /tmp/netlify-secure/key.enc
          base64 -d /tmp/netlify-secure/proxy-data.enc.b64 > /tmp/netlify-secure/proxy.enc
          openssl pkeyutl -decrypt -inkey /tmp/netlify-secure/private.pem -in /tmp/netlify-secure/key.enc -out /tmp/netlify-secure/keyinfo.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          KEY=$(cut -d: -f1 /tmp/netlify-secure/keyinfo.txt)
          IV=$(cut -d: -f2 /tmp/netlify-secure/keyinfo.txt)
          openssl enc -d -aes-256-cbc -K "$KEY" -iv "$IV" -in /tmp/netlify-secure/proxy.enc -out /tmp/netlify-secure/proxy.txt
          PROXY_PATH=$(cat /tmp/netlify-secure/proxy.txt)
          echo "::add-mask::$PROXY_PATH"
          rm -rf .deploy
          npx -y @netlify/mcp@1.15.1 --site-id 9c5d2b43-f827-4907-b68f-bdf0b6c89b4b --proxy-path "$PROXY_PATH"
