name: TTS baseline smoke

on:
  push:
    branches:
      - preview/major-learning-update-2026-09-17

jobs:
  tts-baseline-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify restored OTTO TTS endpoint
        shell: bash
        run: |
          set -euo pipefail
          sleep 70
          URL='https://deploy-preview-23--otto-a1-new.netlify.app/api/otto-tts'

          check_case() {
            local mode="$1"
            local text="$2"
            local headers body status content_type bytes magic
            headers=$(mktemp)
            body=$(mktemp)
            status=$(curl --silent --show-error --max-time 90 -D "$headers" -o "$body" -w '%{http_code}' \
              -X POST "$URL" \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg text "$text" --arg mode "$mode" '{text:$text,mode:$mode}')")
            content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2}' "$headers" | tail -1)
            bytes=$(wc -c < "$body")
            magic=$(xxd -p -l 4 "$body" | tr -d '\n')
            echo "$mode: HTTP=$status content-type=$content_type bytes=$bytes magic=$magic"
            test "$status" = '200'
            case "$content_type" in audio/mpeg*) ;; *) echo 'not audio/mpeg'; cat "$body"; exit 1;; esac
            test "$bytes" -gt 1000
            case "$magic" in 7b*|3c*) echo 'body looks like JSON/HTML, not MP3'; exit 1;; esac
          }

          check_case normal 'Ich heiße Otto.'
          check_case slow 'Können Sie mir bitte helfen?'
