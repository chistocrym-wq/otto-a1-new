name: Fix Lazy Navigation

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/master-roadmap-final-46-52
          fetch-depth: 0
      - name: Apply narrow lazy-route reliability fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="""const Instructions=lazy(()=>import('@/components/Instructions').then(m=>({default:m.Instructions})));const ExamGuide=lazy(()=>import('@/components/ExamGuide').then(m=>({default:m.ExamGuide})));const MockExam=lazy(()=>import('@/components/MockExam').then(m=>({default:m.MockExam})));const ModulesHub=lazy(()=>import('@/components/ModulesHub').then(m=>({default:m.ModulesHub})));const AccountPage=lazy(()=>import('@/components/AccountPage').then(m=>({default:m.AccountPage})));const ReadinessPage=lazy(()=>import('@/components/ReadinessPage').then(m=>({default:m.ReadinessPage})));const PhraseSpeakingPractice=lazy(()=>import('@/components/PhraseSpeakingPractice').then(m=>({default:m.PhraseSpeakingPractice})));const SettingsPage=lazy(()=>import('@/components/SettingsPage').then(m=>({default:m.SettingsPage})));const NewsPage=lazy(()=>import('@/components/NewsPage').then(m=>({default:m.NewsPage})));const SupportPage=lazy(()=>import('@/components/SupportPage').then(m=>({default:m.SupportPage})));const DailyTrainingPage=lazy(()=>import('@/components/DailyTrainingPage').then(m=>({default:m.DailyTrainingPage})));const HowToTrainPage=lazy(()=>import('@/components/HowToTrainPage').then(m=>({default:m.HowToTrainPage})));const ReadingModule=lazy(()=>import('@/components/modules/ReadingModule').then(m=>({default:m.ReadingModule})));const ListeningModule=lazy(()=>import('@/components/modules/ListeningModule').then(m=>({default:m.ListeningModule})));const WritingModule=lazy(()=>import('@/components/modules/WritingModule').then(m=>({default:m.WritingModule})));const SpeakingModule=lazy(()=>import('@/components/modules/SpeakingModule').then(m=>({default:m.SpeakingModule})));
"""
          new="""const loadInstructions=()=>import('@/components/Instructions');const loadExamGuide=()=>import('@/components/ExamGuide');const loadMockExam=()=>import('@/components/MockExam');const loadModulesHub=()=>import('@/components/ModulesHub');const loadAccountPage=()=>import('@/components/AccountPage');const loadReadinessPage=()=>import('@/components/ReadinessPage');const loadPhraseSpeakingPractice=()=>import('@/components/PhraseSpeakingPractice');const loadSettingsPage=()=>import('@/components/SettingsPage');const loadNewsPage=()=>import('@/components/NewsPage');const loadSupportPage=()=>import('@/components/SupportPage');const loadDailyTrainingPage=()=>import('@/components/DailyTrainingPage');const loadHowToTrainPage=()=>import('@/components/HowToTrainPage');const loadReadingModule=()=>import('@/components/modules/ReadingModule');const loadListeningModule=()=>import('@/components/modules/ListeningModule');const loadWritingModule=()=>import('@/components/modules/WritingModule');const loadSpeakingModule=()=>import('@/components/modules/SpeakingModule');
const Instructions=lazy(()=>loadInstructions().then(m=>({default:m.Instructions})));const ExamGuide=lazy(()=>loadExamGuide().then(m=>({default:m.ExamGuide})));const MockExam=lazy(()=>loadMockExam().then(m=>({default:m.MockExam})));const ModulesHub=lazy(()=>loadModulesHub().then(m=>({default:m.ModulesHub})));const AccountPage=lazy(()=>loadAccountPage().then(m=>({default:m.AccountPage})));const ReadinessPage=lazy(()=>loadReadinessPage().then(m=>({default:m.ReadinessPage})));const PhraseSpeakingPractice=lazy(()=>loadPhraseSpeakingPractice().then(m=>({default:m.PhraseSpeakingPractice})));const SettingsPage=lazy(()=>loadSettingsPage().then(m=>({default:m.SettingsPage})));const NewsPage=lazy(()=>loadNewsPage().then(m=>({default:m.NewsPage})));const SupportPage=lazy(()=>loadSupportPage().then(m=>({default:m.SupportPage})));const DailyTrainingPage=lazy(()=>loadDailyTrainingPage().then(m=>({default:m.DailyTrainingPage})));const HowToTrainPage=lazy(()=>loadHowToTrainPage().then(m=>({default:m.HowToTrainPage})));const ReadingModule=lazy(()=>loadReadingModule().then(m=>({default:m.ReadingModule})));const ListeningModule=lazy(()=>loadListeningModule().then(m=>({default:m.ListeningModule})));const WritingModule=lazy(()=>loadWritingModule().then(m=>({default:m.WritingModule})));const SpeakingModule=lazy(()=>loadSpeakingModule().then(m=>({default:m.SpeakingModule})));
const routePreloaders=[loadInstructions,loadExamGuide,loadMockExam,loadModulesHub,loadAccountPage,loadReadinessPage,loadPhraseSpeakingPractice,loadSettingsPage,loadNewsPage,loadSupportPage,loadDailyTrainingPage,loadHowToTrainPage,loadReadingModule,loadListeningModule,loadWritingModule,loadSpeakingModule] as const;
"""
          if old not in s: raise SystemExit('lazy route block not found')
          s=s.replace(old,new,1)
          old2="""type View=ModuleId|'instructions'|'exam-guide'|'mock-exam'|'modules'|'readiness'|'phrases-speaking'|'account'|'settings'|'news'|'support'|'daily-training'|'how-to-train'|null;
const moduleIds:ModuleId[]=['lesen','horen','schreiben','sprechen'];
"""
          new2="""type View=ModuleId|'instructions'|'exam-guide'|'mock-exam'|'modules'|'readiness'|'phrases-speaking'|'account'|'settings'|'news'|'support'|'daily-training'|'how-to-train'|null;
const moduleIds:ModuleId[]=['lesen','horen','schreiben','sprechen'];
const RECOVER_VIEW_KEY='otto-a1-recover-view';const RECOVER_AT_KEY='otto-a1-recover-at';
const validRecoveredViews=new Set<string>(['lesen','horen','schreiben','sprechen','instructions','exam-guide','mock-exam','modules','readiness','phrases-speaking','account','settings','news','support','daily-training','how-to-train']);
function readRecoveredView():View{try{const raw=sessionStorage.getItem(RECOVER_VIEW_KEY);sessionStorage.removeItem(RECOVER_VIEW_KEY);return raw&&validRecoveredViews.has(raw)?raw as View:null}catch{return null}}
"""
          if old2 not in s: raise SystemExit('View block not found')
          s=s.replace(old2,new2,1)
          old3=""" const productMode=getOttoProductMode();const[view,setView]=useState<View>(null);const[dailyMinutes,setDailyMinutes]=useState<Minutes>(()=>{const s=Number(localStorage.getItem('otto-a1-session-minutes'));return s===5||s===15||s===30?s:15});const[actionNotice,setActionNotice]=useState<string|null>(null);const moduleStartedAt=useRef(Date.now());const{progress,activity,recordScore}=useProgress();const back=useCallback(()=>setView(null),[]);
"""
          new3=""" const productMode=getOttoProductMode();const[view,setView]=useState<View>(readRecoveredView);const viewRef=useRef<View>(view);viewRef.current=view;const[dailyMinutes,setDailyMinutes]=useState<Minutes>(()=>{const s=Number(localStorage.getItem('otto-a1-session-minutes'));return s===5||s===15||s===30?s:15});const[actionNotice,setActionNotice]=useState<string|null>(null);const moduleStartedAt=useRef(Date.now());const{progress,activity,recordScore}=useProgress();const back=useCallback(()=>setView(null),[]);
"""
          if old3 not in s: raise SystemExit('state block not found')
          s=s.replace(old3,new3,1)
          old4=""" const openModule=useCallback((module:ModuleId)=>{moduleStartedAt.current=Date.now();setView(module)},[]);const openDailyTraining=useCallback((minutes:Minutes)=>{setDailyMinutes(minutes);setView('daily-training')},[]);
 useEffect(()=>{const t=window.Telegram?.WebApp;if(t){t.ready();t.expand()}},[]);
"""
          new4=""" const openModule=useCallback((module:ModuleId)=>{moduleStartedAt.current=Date.now();setView(module)},[]);const openDailyTraining=useCallback((minutes:Minutes)=>{setDailyMinutes(minutes);setView('daily-training')},[]);
 useEffect(()=>{const id=window.setTimeout(()=>{void Promise.allSettled(routePreloaders.map(load=>load()))},350);return()=>window.clearTimeout(id)},[]);
 useEffect(()=>{const onPreloadError=(event:Event)=>{event.preventDefault();const now=Date.now();let last=0;try{last=Number(sessionStorage.getItem(RECOVER_AT_KEY)||0)}catch{/* ignore */}try{if(now-last<15000)sessionStorage.removeItem(RECOVER_VIEW_KEY);else if(viewRef.current)sessionStorage.setItem(RECOVER_VIEW_KEY,viewRef.current);sessionStorage.setItem(RECOVER_AT_KEY,String(now))}catch{/* ignore */}window.location.reload()};window.addEventListener('vite:preloadError',onPreloadError);return()=>window.removeEventListener('vite:preloadError',onPreloadError)},[]);
 useEffect(()=>{const t=window.Telegram?.WebApp;if(t){t.ready();t.expand()}},[]);
"""
          if old4 not in s: raise SystemExit('effect insertion point not found')
          s=s.replace(old4,new4,1)
          p.write_text(s)
          PY
      - name: Verify source
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-lazy-navigation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx .github/workflows/fix-lazy-navigation.yml
          git commit -m "Prevent lazy route white screens"
          git push origin HEAD:task/master-roadmap-final-46-52
