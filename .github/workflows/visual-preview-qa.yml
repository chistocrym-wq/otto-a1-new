name: Visual Preview QA

on:
  pull_request:
    branches: [main]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture mobile and desktop
        run: |
          npx vite preview --host 127.0.0.1 > /tmp/otto-vite.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const profile={name:'QA',contactType:'email',contact:'qa@example.com',contactVerified:false,learningMode:'direct',createdAt:'2026-09-17T00:00:00.000Z',updatedAt:'2026-09-17T00:00:00.000Z'};
            async function capture(name,width,height,onboarding){
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              if(!onboarding){
                await page.addInitScript(({profile})=>{
                  localStorage.setItem('otto-user-profile',JSON.stringify(profile));
                  localStorage.setItem('otto-onboarding-completed','true');
                  localStorage.setItem('otto-learning-mode-v1','direct');
                },{profile});
              }
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await page.waitForTimeout(8500);
              await page.screenshot({path:`visual-qa/${name}.png`,fullPage:true});
              const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,scrollHeight:document.documentElement.scrollHeight,bodyWidth:document.body.getBoundingClientRect().width}));
              fs.appendFileSync('visual-qa/metrics.jsonl',JSON.stringify({name,width,height,...metrics})+'\n');
              await context.close();
            }
            fs.mkdirSync('visual-qa',{recursive:true});
            await capture('onboarding-360',360,800,true);
            await capture('onboarding-430',430,932,true);
            await capture('dashboard-360',360,800,false);
            await capture('dashboard-430',430,932,false);
            await capture('dashboard-desktop',1440,1000,false);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cat visual-qa/metrics.jsonl
      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: otto-visual-qa-palette
          path: visual-qa
          retention-days: 1
