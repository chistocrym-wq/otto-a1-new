name: Mobile app QA

on:
  push:
    branches:
      - feature/unify-app-ui-and-navigation

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser driver
        run: python -m pip install --quiet selenium
      - name: Wait for Netlify preview
        run: sleep 35
      - name: Run mobile navigation QA and capture screens
        env:
          PREVIEW_URL: https://deploy-preview-5--otto-a1-new.netlify.app
        run: |
          cat > "$RUNNER_TEMP/mobile_qa.py" <<'PY'
          import os, time, json
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.chrome.options import Options

          out = Path(os.environ['RUNNER_TEMP']) / 'otto-mobile-qa'
          out.mkdir(parents=True, exist_ok=True)
          url = os.environ['PREVIEW_URL'] + '/?qa=mobile'

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--hide-scrollbars')
          options.add_argument('--window-size=941,1672')
          options.add_argument('--force-device-scale-factor=1')
          options.add_argument('--disable-notifications')

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 20)
          report = []

          def settle(seconds=0.6):
              time.sleep(seconds)

          def visible_text(text):
              return wait.until(EC.visibility_of_element_located((By.XPATH, f"//*[contains(normalize-space(.), {json.dumps(text)})]")))

          def button_text(text):
              return wait.until(EC.element_to_be_clickable((By.XPATH, f"//button[contains(normalize-space(.), {json.dumps(text)})]")))

          def click_text(text):
              el = button_text(text)
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});", el)
              settle(.2)
              el.click()
              settle()
              return el

          def shot(name):
              settle(.4)
              width = driver.execute_script('return window.innerWidth')
              scrollw = driver.execute_script('return document.documentElement.scrollWidth')
              if scrollw > width + 1:
                  raise AssertionError(f'horizontal overflow on {name}: viewport={width}, scrollWidth={scrollw}')
              path = out / f'{name}-941x1672.png'
              driver.save_screenshot(str(path))
              report.append({'screen': name, 'viewport': width, 'scrollWidth': scrollw, 'path': str(path)})

          try:
              driver.get(url)
              visible_text('Мой прогресс')
              settle(2.0)
              shot('01-home')

              # Settings + all functional accordion rows.
              click_text('Настройки')
              visible_text('Язык интерфейса')
              shot('02-settings')
              for label, expected in [
                  ('Звук и микрофон', 'Аудио Hören'),
                  ('Уведомления', 'скрытого внутреннего переключателя'),
                  ('Установка приложения', 'Добавить на главный экран'),
                  ('Язык интерфейса', 'Основной интерфейс OTTO'),
              ]:
                  click_text(label)
                  visible_text(expected)

              # Bottom navigation reaches Modules.
              click_text('Модули')
              visible_text('Выберите раздел и продолжайте подготовку')
              shot('03-modules')
              click_text('Главная')
              visible_text('Мой прогресс')

              # Real Hören route and back.
              click_text('Hören')
              visible_text('Aufgabe 1')
              shot('04-horen')
              back_btn = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, 'button[aria-label="Назад"]')))
              back_btn.click(); settle()
              visible_text('Мой прогресс')

              # Mock exam route.
              exam_button = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, '.otto-real-exam > button')))
              exam_button.click(); settle()
              visible_text('Тестовый экзамен A1')
              shot('05-mock-exam')
              click_text('Главная')
              visible_text('Мой прогресс')

              # News and explicit back.
              click_text('Новости')
              visible_text('Что нового в тренажёре')
              shot('06-news')
              back_btn = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, 'button[aria-label="Назад"]')))
              back_btn.click(); settle()
              visible_text('Мой прогресс')

              # Support and its real action.
              click_text('Поддержка')
              visible_text('Помощь по тренажёру')
              shot('07-support')
              copy_btn = button_text('Скопировать техническую информацию')
              copy_btn.click(); settle(.5)
              back_btn = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, 'button[aria-label="Назад"]')))
              back_btn.click(); settle()
              visible_text('Мой прогресс')

              # Guides.
              click_text('Гайды')
              wait.until(lambda d: 'otto-view-exam-guide' in d.find_element(By.CSS_SELECTOR, '.telegram-app').get_attribute('class'))
              shot('08-guides')
              click_text('Главная')
              visible_text('Мой прогресс')

              # Progress/account route.
              progress = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, '.otto-real-progress')))
              progress.click(); settle()
              visible_text('Ваш прогресс в подготовке A1')
              shot('09-progress')
              click_text('Главная')
              visible_text('Мой прогресс')

              # Share is wired. Headless browser can deny clipboard/share; it must not navigate to a dead view or crash.
              share = wait.until(EC.element_to_be_clickable((By.XPATH, "//nav[contains(@class,'otto-real-home-nav')]//button[contains(.,'Поделиться')]")))
              share.click(); settle(.6)
              visible_text('Мой прогресс')

              with open(out / 'qa-report.json', 'w', encoding='utf-8') as f:
                  json.dump({'ok': True, 'screens': report}, f, ensure_ascii=False, indent=2)
              print('MOBILE_QA_OK')
          finally:
              driver.quit()
          PY
          python "$RUNNER_TEMP/mobile_qa.py"
      - name: Upload mobile QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: otto-mobile-qa
          path: ${{ runner.temp }}/otto-mobile-qa
          if-no-files-found: error
          retention-days: 2
