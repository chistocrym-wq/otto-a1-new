name: Mobile app QA

on:
  push:
    branches:
      - feature/unify-app-ui-and-navigation

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser driver
        run: python -m pip install --quiet selenium
      - name: Wait for Netlify preview
        run: sleep 35
      - name: Run mobile navigation QA and capture screens
        env:
          PREVIEW_URL: https://deploy-preview-5--otto-a1-new.netlify.app
        run: |
          cat > "$RUNNER_TEMP/mobile_qa.py" <<'PY'
          import os, time, json
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.chrome.options import Options

          out = Path(os.environ['RUNNER_TEMP']) / 'otto-mobile-qa'
          out.mkdir(parents=True, exist_ok=True)
          url = os.environ['PREVIEW_URL'] + '/?qa=mobile'

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--hide-scrollbars')
          options.add_argument('--window-size=941,1672')
          options.add_argument('--force-device-scale-factor=1')
          options.add_argument('--disable-notifications')

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 25)
          report = []

          def settle(seconds=0.7):
              time.sleep(seconds)

          def literal(text):
              if "'" not in text:
                  return f"'{text}'"
              return '"' + text.replace('"', '') + '"'

          def clean_preview_chrome():
              driver.execute_script("""
                document.querySelectorAll('iframe[title="Netlify Drawer"]').forEach(el => el.remove());
                document.querySelectorAll('[data-netlify-drawer], netlify-drawer').forEach(el => el.remove());
              """)

          def visible_text(text):
              clean_preview_chrome()
              return wait.until(EC.visibility_of_element_located((By.XPATH, f"//*[contains(normalize-space(.), {literal(text)})]")))

          def button_text(text):
              clean_preview_chrome()
              return wait.until(EC.presence_of_element_located((By.XPATH, f"//button[contains(normalize-space(.), {literal(text)})]")))

          def js_click(el):
              clean_preview_chrome()
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});", el)
              settle(.15)
              driver.execute_script("arguments[0].click();", el)
              settle()

          def click_text(text):
              el = button_text(text)
              js_click(el)
              return el

          def wait_view(name):
              wait.until(lambda d: f'otto-view-{name}' in d.find_element(By.CSS_SELECTOR, '.telegram-app').get_attribute('class'))
              settle(.45)

          def go_home():
              btn = wait.until(EC.presence_of_element_located((By.XPATH, "//button[contains(normalize-space(.),'Главная')]")))
              js_click(btn)
              wait_view('home')
              visible_text('Мой прогресс')

          def go_back():
              clean_preview_chrome()
              labelled = driver.find_elements(By.CSS_SELECTOR, 'button[aria-label="Назад"], button[aria-label="Вернуться"]')
              btn = next((el for el in labelled if el.is_displayed()), None)
              if btn is None:
                  # Some legacy module headers use the same visible arrow control
                  # without an aria-label. Exercise that real control rather than
                  # treating the missing label as a broken navigation path.
                  header_buttons = driver.find_elements(By.CSS_SELECTOR, '.otto-inner-screen > .animate-fade-in > div:first-child button')
                  btn = next((el for el in header_buttons if el.is_displayed()), None)
              if btn is None:
                  # Last-resort user path: the persistent Home tab is always a
                  # valid way out of a module and must return to the dashboard.
                  btn = wait.until(EC.presence_of_element_located((By.XPATH, "//button[contains(normalize-space(.),'Главная')]")))
              js_click(btn)
              wait_view('home')
              visible_text('Мой прогресс')

          def shot(name):
              clean_preview_chrome()
              settle(.45)
              width = driver.execute_script('return window.innerWidth')
              scrollw = driver.execute_script('return document.documentElement.scrollWidth')
              if scrollw > width + 1:
                  raise AssertionError(f'horizontal overflow on {name}: viewport={width}, scrollWidth={scrollw}')
              path = out / f'{name}-941x1672.png'
              driver.save_screenshot(str(path))
              report.append({'screen': name, 'viewport': width, 'scrollWidth': scrollw, 'path': str(path)})

          try:
              driver.get(url)
              visible_text('Мой прогресс')
              settle(2.0)
              shot('01-home')

              click_text('Настройки')
              wait_view('settings')
              visible_text('Язык интерфейса')
              shot('02-settings')
              for label, expected in [
                  ('Звук и микрофон', 'Аудио Hören'),
                  ('Уведомления', 'скрытого внутреннего переключателя'),
                  ('Установка приложения', 'Добавить на главный экран'),
                  ('Язык интерфейса', 'Основной интерфейс OTTO'),
              ]:
                  click_text(label)
                  visible_text(expected)
              shot('02b-settings-open')

              click_text('Модули')
              wait_view('modules')
              visible_text('Выберите раздел и продолжайте подготовку')
              shot('03-modules')
              go_home()

              # All four real training modules and their visible return path.
              for label, view, shot_name in [
                  ('Hören', 'horen', '04-horen'),
                  ('Lesen', 'lesen', '05-lesen'),
                  ('Schreiben', 'schreiben', '06-schreiben'),
                  ('Sprechen', 'sprechen', '07-sprechen'),
              ]:
                  click_text(label)
                  wait_view(view)
                  shot(shot_name)
                  go_back()

              exam_button = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '.otto-real-exam > button')))
              js_click(exam_button)
              wait_view('mock-exam')
              visible_text('Тестовый экзамен A1')
              shot('08-mock-exam')
              go_home()

              click_text('Новости')
              wait_view('news')
              visible_text('Что нового в тренажёре')
              shot('09-news')
              go_back()

              click_text('Поддержка')
              wait_view('support')
              visible_text('Помощь по тренажёру')
              shot('10-support')
              js_click(button_text('Скопировать техническую информацию'))
              go_back()

              click_text('Гайды')
              wait_view('exam-guide')
              shot('11-guides')
              go_home()

              click_text('Бланки')
              wait_view('instructions')
              shot('12-instructions')
              go_back()

              progress = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '.otto-real-progress')))
              js_click(progress)
              wait_view('account')
              visible_text('Ваш прогресс в подготовке A1')
              shot('13-progress')
              go_home()

              share = wait.until(EC.presence_of_element_located((By.XPATH, "//nav[contains(@class,'otto-real-home-nav')]//button[contains(.,'Поделиться')]")))
              js_click(share)
              settle(.6)
              wait_view('home')
              visible_text('Мой прогресс')

              with open(out / 'qa-report.json', 'w', encoding='utf-8') as f:
                  json.dump({'ok': True, 'screens': report}, f, ensure_ascii=False, indent=2)
              print('MOBILE_QA_OK')
          except Exception as exc:
              clean_preview_chrome()
              driver.save_screenshot(str(out / '99-failure-941x1672.png'))
              with open(out / 'qa-report.json', 'w', encoding='utf-8') as f:
                  json.dump({'ok': False, 'error': repr(exc), 'screens': report}, f, ensure_ascii=False, indent=2)
              raise
          finally:
              driver.quit()
          PY
          python "$RUNNER_TEMP/mobile_qa.py"
      - name: Upload mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otto-mobile-qa
          path: ${{ runner.temp }}/otto-mobile-qa
          if-no-files-found: error
          retention-days: 2
