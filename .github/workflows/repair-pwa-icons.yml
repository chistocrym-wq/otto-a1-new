name: Repair PWA Icons

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

permissions:
  contents: write

jobs:
  repair-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/master-roadmap-final-46-52
          fetch-depth: 0
      - name: Build valid Otto headphones icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw

          src=Image.open('public/otto.png').convert('RGBA')

          def make(size):
              S=size*4
              bg=Image.new('RGBA',(S,S),(16,127,116,255))
              d=ImageDraw.Draw(bg)
              pad=int(S*0.055)
              d.ellipse((pad,pad,S-pad,S-pad), fill=(233,244,240,255), outline=(255,255,255,255), width=max(4,int(S*.018)))
              crop=src.crop((80,0,455,390))
              target_w=int(S*0.90)
              target_h=int(crop.height*target_w/crop.width)
              crop=crop.resize((target_w,target_h), Image.Resampling.LANCZOS)
              bg.alpha_composite(crop,((S-target_w)//2,int(S*0.06)))
              d=ImageDraw.Draw(bg)
              dark=(28,65,89,255)
              teal=(33,150,157,255)
              d.arc((int(S*.235),int(S*.055),int(S*.765),int(S*.57)), start=197, end=343, fill=dark, width=int(S*.055))
              d.arc((int(S*.245),int(S*.068),int(S*.755),int(S*.56)), start=198, end=342, fill=teal, width=int(S*.022))
              for cx in (int(S*.205), int(S*.795)):
                  cy=int(S*.47); w=int(S*.115); h=int(S*.19)
                  d.rounded_rectangle((cx-w//2,cy-h//2,cx+w//2,cy+h//2), radius=int(S*.045), fill=dark, outline=(255,255,255,255), width=int(S*.01))
                  d.rounded_rectangle((cx-int(w*.28),cy-int(h*.32),cx+int(w*.28),cy+int(h*.32)), radius=int(S*.025), fill=teal)
              d.arc((int(S*.68),int(S*.47),int(S*.89),int(S*.73)), start=65,end=150,fill=dark,width=int(S*.016))
              d.ellipse((int(S*.666),int(S*.648),int(S*.697),int(S*.679)),fill=dark)
              return bg.resize((size,size),Image.Resampling.LANCZOS).convert('RGB')

          for size in (192,512):
              make(size).save(f'public/otto-icon-{size}.png','PNG',optimize=True)
              im=Image.open(f'public/otto-icon-{size}.png')
              im.load()
              assert im.size == (size,size) and im.format == 'PNG'
          PY
      - name: Commit repaired icons
        run: |
          if git diff --quiet -- public/otto-icon-192.png public/otto-icon-512.png; then
            echo "Icons already valid and current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/otto-icon-192.png public/otto-icon-512.png
          git commit -m "Repair valid Otto headphones PWA icons"
          git push origin HEAD:task/master-roadmap-final-46-52
