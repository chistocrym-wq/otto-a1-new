name: Otto Start voice smoke

on:
  push:
    branches:
      - preview/otto-start-voice-hotfix-2026-09-17

jobs:
  voice-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Compare source and preview TTS runtime
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          SOURCE='https://otto-start.netlify.app/api/otto-tts'
          TARGET='https://deploy-preview-24--otto-a1-new.netlify.app/api/otto-tts'

          probe() {
            local label="$1"
            local url="$2"
            local headers body status content_type bytes riff wave provider pronunciation
            headers=$(mktemp)
            body=$(mktemp)
            status=$(curl --silent --show-error --max-time 90 -G -D "$headers" -o "$body" -w '%{http_code}' \
              --data-urlencode 'text=Ich heiße Otto.' \
              --data-urlencode 'mode=normal' \
              --data-urlencode 'kind=text' \
              "$url")
            content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2}' "$headers" | tail -1)
            bytes=$(wc -c < "$body")
            riff=$(xxd -p -l 4 "$body" | tr -d '\n')
            wave=$(dd if="$body" bs=1 skip=8 count=4 2>/dev/null | xxd -p | tr -d '\n')
            provider=$(awk 'BEGIN{IGNORECASE=1} /^x-otto-provider:/{gsub("\r",""); print $2}' "$headers" | tail -1)
            pronunciation=$(awk 'BEGIN{IGNORECASE=1} /^x-otto-pronunciation:/{gsub("\r",""); print $2}' "$headers" | tail -1)
            echo "$label: HTTP=$status type=$content_type bytes=$bytes RIFF=$riff WAVE=$wave provider=$provider pronunciation=$pronunciation"
            if [ "$status" != '200' ]; then echo "$label ERROR BODY:"; head -c 800 "$body"; echo; return 1; fi
            case "$content_type" in audio/wav*) ;; *) echo "$label not audio/wav"; return 1;; esac
            test "$bytes" -gt 1000
            test "$riff" = '52494646'
            test "$wave" = '57415645'
          }

          source_ok=0
          target_ok=0
          probe SOURCE "$SOURCE" || source_ok=$?
          probe TARGET "$TARGET" || target_ok=$?
          test "$source_ok" = '0'
          test "$target_ok" = '0'
