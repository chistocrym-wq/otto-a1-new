name: Onboarding mobile viewport check

on:
  push:
    branches:
      - preview/onboarding-mobile-hotfix-2026-09-17

jobs:
  viewport-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify profile onboarding at target viewports
        env:
          PREVIEW_URL: https://deploy-preview-25--otto-a1-new.netlify.app/
        run: |
          cat > /tmp/check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const url = process.env.PREVIEW_URL;
          const sizes = [[320,568],[360,640],[390,844],[430,932]];
          const browser = await chromium.launch({ headless: true });

          async function reachProfile(page) {
            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            const setup = page.getByRole('button', { name: /Настроить мой профиль/i });
            if (await setup.count()) await setup.click();
            await page.getByRole('heading', { name: 'Как к вам обращаться?' }).waitFor({ timeout: 20000 });
            await page.getByLabel('Имя').fill('Анна');
            await page.getByLabel('Email').fill('anna@example.com');
          }

          for (const [width,height] of sizes) {
            const context = await browser.newContext({ viewport: { width, height }, isMobile: true, hasTouch: true });
            const page = await context.newPage();
            await reachProfile(page);
            const button = page.getByRole('button', { name: /Продолжить/i });
            await button.scrollIntoViewIfNeeded();
            const result = await page.evaluate(() => {
              const main = document.querySelector('main');
              const button = [...document.querySelectorAll('button')].find((el) => el.textContent?.includes('Продолжить'));
              const r = button?.getBoundingClientRect();
              const s = main ? getComputedStyle(main) : null;
              return {
                innerHeight: window.innerHeight,
                top: r?.top ?? -1,
                bottom: r?.bottom ?? -1,
                disabled: button?.disabled ?? true,
                overflowY: s?.overflowY,
                paddingBottom: s?.paddingBottom,
                justifyContent: main?.firstElementChild ? getComputedStyle(main.firstElementChild).justifyContent : null,
                mainScrollHeight: main?.scrollHeight ?? 0,
                mainClientHeight: main?.clientHeight ?? 0,
              };
            });
            console.log(`VIEWPORT ${width}x${height}`, JSON.stringify(result));
            if (result.disabled) throw new Error(`${width}x${height}: continue disabled after valid fields`);
            if (result.top < 0 || result.bottom > result.innerHeight - 2) throw new Error(`${width}x${height}: continue not reachable within viewport after scroll`);
            if (result.overflowY !== 'auto') throw new Error(`${width}x${height}: profile main is not vertically scrollable`);
            if (result.justifyContent !== 'flex-start') throw new Error(`${width}x${height}: profile is still vertically centered on mobile`);

            // Simulate a reduced visual viewport similar to an on-screen keyboard.
            await page.getByLabel('Email').focus();
            await page.setViewportSize({ width, height: Math.max(300, height - 260) });
            await button.scrollIntoViewIfNeeded();
            const keyboard = await button.boundingBox();
            const keyboardHeight = await page.evaluate(() => window.innerHeight);
            console.log(`KEYBOARD_SIM ${width}x${Math.max(300,height-260)}`, JSON.stringify({keyboard, keyboardHeight}));
            if (!keyboard || keyboard.y < 0 || keyboard.y + keyboard.height > keyboardHeight - 2) throw new Error(`${width}: button cannot be reached with reduced visual viewport`);
            await context.close();
          }

          const desktop = await browser.newContext({ viewport: { width: 1365, height: 900 } });
          const desktopPage = await desktop.newPage();
          await reachProfile(desktopPage);
          const dButton = desktopPage.getByRole('button', { name: /Продолжить/i });
          await dButton.scrollIntoViewIfNeeded();
          const d = await desktopPage.evaluate(() => {
            const main = document.querySelector('main');
            const inner = main?.firstElementChild;
            const button = [...document.querySelectorAll('button')].find((el) => el.textContent?.includes('Продолжить'));
            const r = button?.getBoundingClientRect();
            return { innerHeight: window.innerHeight, top:r?.top, bottom:r?.bottom, justifyContent: inner ? getComputedStyle(inner).justifyContent : null };
          });
          console.log('DESKTOP 1365x900', JSON.stringify(d));
          if ((d.bottom ?? 9999) > d.innerHeight) throw new Error('desktop regression: continue button inaccessible');
          if (d.justifyContent !== 'center') throw new Error('desktop regression: centering changed');
          await desktop.close();
          await browser.close();
          NODE
          node /tmp/check.mjs
