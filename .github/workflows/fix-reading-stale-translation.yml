name: Fix Lesen Stale Translation

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/master-roadmap-final-46-52
          fetch-depth: 0
      - name: Reset and abort old Lesen explanation translation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/components/modules/ReadingModule.tsx')
          text=path.read_text()
          old="function BilingualWhy({text}:{text:string}){const[pair,setPair]=useState<{de:string;ru:string}|null>(null);useEffect(()=>{let live=true;fetch('/api/translate-task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'explain-pair',text})}).then(r=>r.json()).then(p=>{if(live&&p?.de&&p?.ru)setPair({de:String(p.de),ru:String(p.ru)})}).catch(()=>{});return()=>{live=false}},[text]);return <div className=\"mt-2 space-y-1 text-sm leading-6 text-slate-700\">{pair?<><p><b>Deutsch:</b> {pair.de}</p><p><b>Русский:</b> {pair.ru}</p></>:<p>{text}</p>}</div>}"
          new="function BilingualWhy({text}:{text:string}){const[pair,setPair]=useState<{de:string;ru:string}|null>(null);useEffect(()=>{const controller=new AbortController();setPair(null);fetch('/api/translate-task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'explain-pair',text}),signal:controller.signal}).then(r=>r.json()).then(p=>{if(!controller.signal.aborted&&p?.de&&p?.ru)setPair({de:String(p.de),ru:String(p.ru)})}).catch(()=>{});return()=>controller.abort()},[text]);return <div className=\"mt-2 space-y-1 text-sm leading-6 text-slate-700\">{pair?<><p><b>Deutsch:</b> {pair.de}</p><p><b>Русский:</b> {pair.ru}</p></>:<p>{text}</p>}</div>}"
          if text.count(old)!=1:
              raise SystemExit(f'Expected one Lesen BilingualWhy target, got {text.count(old)}')
          path.write_text(text.replace(old,new))
          PY
      - name: Commit narrow Lesen fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-reading-stale-translation.yml
          git add src/components/modules/ReadingModule.tsx
          git commit -m "Prevent stale Lesen explanation translations"
          git push origin HEAD:task/master-roadmap-final-46-52
