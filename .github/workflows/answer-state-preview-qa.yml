name: Lesen Horen Answer State Preview QA

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

jobs:
  answer-state-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Lesen and Horen selected answer states
        env:
          TARGET_URL: https://deploy-preview-17--otto-a1-new.netlify.app
        run: |
          sleep 55
          cat > qa-answer-states.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = process.env.TARGET_URL;
          const browser = await chromium.launch({ headless: true });
          fs.mkdirSync('answer-state-qa', { recursive: true });

          const SKY = 'rgb(240, 249, 255)';
          const GREEN = 'rgb(236, 253, 245)';
          const RED = 'rgb(255, 241, 242)';
          const STATE_COLORS = new Set([SKY, GREEN, RED]);

          async function openModules(page) {
            await page.goto(base + '/?qa=answer-state-' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.locator('.otto-splash-screen').waitFor({ state: 'detached', timeout: 15000 }).catch(() => {});
            await page.waitForTimeout(600);
            await page.locator('.otto-bottom-nav-item').nth(1).click();
          }
          async function bg(locator) { return locator.evaluate(el => getComputedStyle(el).backgroundColor); }
          async function cls(locator) { return (await locator.getAttribute('class')) || ''; }
          async function expectNeutral(locator, label) {
            const value = await bg(locator);
            if (STATE_COLORS.has(value)) throw new Error(`${label} is already state-colored: ${value}`);
            return value;
          }
          async function expectSelected(locator, label) {
            const classes = await cls(locator);
            if (!classes.includes('bg-sky-50') || classes.includes('bg-emerald-50') || classes.includes('bg-rose-50')) throw new Error(`${label} classes are wrong before check: ${classes}`);
            await new Promise(r => setTimeout(r, 250));
            const value = await bg(locator);
            if (value !== SKY) throw new Error(`${label} is not pale blue after transition: ${value}`);
            return value;
          }
          async function expectChecked(locator, label) {
            await new Promise(r => setTimeout(r, 250));
            const classes = await cls(locator);
            const value = await bg(locator);
            if (![GREEN, RED].includes(value)) throw new Error(`${label} is not green/red after check: ${value}; ${classes}`);
            if (!(classes.includes('bg-emerald-50') || classes.includes('bg-rose-50'))) throw new Error(`${label} has no checked state class: ${classes}`);
            return value;
          }

          async function testLesen(viewport, suffix) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            await openModules(page);
            await page.getByRole('button', { name: /Lesen/ }).click();
            const starts = page.getByRole('button', { name: /Начать тренировку|Продолжить/ });
            await starts.nth(2).click();
            const answers = page.locator('button.min-h-12.border-2');
            await answers.first().waitFor({ state: 'visible' });
            if (await answers.count() !== 2) throw new Error('Lesen Teil 3 answer buttons not found');
            const neutral = [await expectNeutral(answers.nth(0), 'Lesen first answer'), await expectNeutral(answers.nth(1), 'Lesen second answer')];
            await page.screenshot({ path: `answer-state-qa/lesen-neutral-${suffix}.png` });
            await answers.nth(0).click();
            const selected = await expectSelected(answers.nth(0), 'Lesen selected answer');
            await expectNeutral(answers.nth(1), 'Lesen unselected answer before check');
            await page.screenshot({ path: `answer-state-qa/lesen-selected-${suffix}.png` });
            await page.getByRole('button', { name: 'Проверить', exact: true }).click();
            const checked = await expectChecked(answers.nth(0), 'Lesen selected answer');
            await expectNeutral(answers.nth(1), 'Lesen unselected answer after check');
            await page.screenshot({ path: `answer-state-qa/lesen-checked-${suffix}.png` });
            await context.close();
            return { neutral, selected, checked };
          }

          async function testHoren(viewport, suffix) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            await openModules(page);
            await page.getByRole('button', { name: /Hören/ }).click();
            const answers = page.locator('button.min-h-12.border-2');
            await answers.first().waitFor({ state: 'visible' });
            const count = await answers.count();
            if (count < 2) throw new Error('Hören answer buttons not found');
            const neutral = [];
            for (let i = 0; i < count; i++) neutral.push(await expectNeutral(answers.nth(i), `Hören answer ${i+1}`));
            await page.screenshot({ path: `answer-state-qa/horen-neutral-${suffix}.png` });
            await answers.nth(0).click();
            const selected = await expectSelected(answers.nth(0), 'Hören selected answer');
            for (let i = 1; i < count; i++) await expectNeutral(answers.nth(i), `Hören unselected answer ${i+1} before check`);
            await page.screenshot({ path: `answer-state-qa/horen-selected-${suffix}.png` });
            await page.getByRole('button', { name: 'Проверить', exact: true }).click();
            const checked = await expectChecked(answers.nth(0), 'Hören selected answer');
            for (let i = 1; i < count; i++) await expectNeutral(answers.nth(i), `Hören unselected answer ${i+1} after check`);
            await page.screenshot({ path: `answer-state-qa/horen-checked-${suffix}.png` });
            await context.close();
            return { neutral, selected, checked };
          }

          const result = {
            mobile: {
              lesen: await testLesen({ width: 390, height: 844 }, '390'),
              horen: await testHoren({ width: 390, height: 844 }, '390')
            },
            desktop: {
              lesen: await testLesen({ width: 1366, height: 900 }, '1366'),
              horen: await testHoren({ width: 1366, height: 900 }, '1366')
            }
          };
          fs.writeFileSync('answer-state-qa/results.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result));
          await browser.close();
          NODE
          node qa-answer-states.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesen-horen-answer-state-qa
          path: answer-state-qa
          retention-days: 3
