name: Settings PWA Preview QA

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

jobs:
  settings-pwa-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify Settings actions and PWA
        env:
          PREVIEW_URL: https://deploy-preview-17--otto-a1-new.netlify.app
        run: |
          cat > qa-settings-pwa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const base = process.env.PREVIEW_URL;
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
          const page = await context.newPage();
          await page.addInitScript(() => {
            Object.defineProperty(navigator, 'share', {
              configurable: true,
              value: async data => { window.__ottoShared = data; }
            });
          });

          await page.goto(base, {waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForTimeout(2500);
          const settingsNav = page.getByRole('button', {name:/Настройки|Einstellungen/}).last();
          await settingsNav.click();
          await page.getByRole('button', {name:/Установить приложение|App installieren|Приложение установлено|App ist installiert/}).waitFor({state:'visible'});

          for (const label of ['Установить приложение','Написать в поддержку','Поделиться']) {
            const count = await page.getByText(label, {exact:true}).count();
            if (!count) throw new Error(`Missing Settings action: ${label}`);
          }

          const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth);
          if (overflow) throw new Error('Settings has horizontal overflow at 390px');
          await fs.mkdir('settings-pwa-qa', {recursive:true});
          await page.screenshot({path:'settings-pwa-qa/settings-mobile.png', fullPage:true});

          const manifest = await page.evaluate(async () => {
            const r = await fetch('/manifest.webmanifest?v=19', {cache:'no-store'});
            return r.json();
          });
          if (manifest.display !== 'standalone') throw new Error(`Manifest display is ${manifest.display}`);
          if (!Array.isArray(manifest.icons) || !manifest.icons.some(i => String(i.src).includes('otto-icon-192.png')) || !manifest.icons.some(i => String(i.src).includes('otto-icon-512.png'))) throw new Error('Manifest Otto icons are missing');

          await page.waitForFunction(async () => Boolean(await navigator.serviceWorker.getRegistration()), null, {timeout:20000});
          const sw = await page.evaluate(async () => {
            const registration = await navigator.serviceWorker.getRegistration();
            return registration?.active?.scriptURL || registration?.waiting?.scriptURL || registration?.installing?.scriptURL || '';
          });
          if (!sw.endsWith('/sw.js')) throw new Error(`Unexpected service worker: ${sw}`);

          await page.evaluate(() => {
            window.__ottoPromptCalled = false;
            const event = new Event('beforeinstallprompt', {cancelable:true});
            Object.defineProperty(event, 'prompt', {value: async () => { window.__ottoPromptCalled = true; }});
            Object.defineProperty(event, 'userChoice', {value: Promise.resolve({outcome:'accepted', platform:'web'})});
            window.dispatchEvent(event);
          });
          await page.getByRole('button', {name:/Установить приложение|App installieren/}).click();
          await page.waitForTimeout(100);
          const promptCalled = await page.evaluate(() => window.__ottoPromptCalled === true);
          if (!promptCalled) throw new Error('Install button did not call captured PWA prompt');
          await page.getByText('Установка приложения запущена.', {exact:true}).waitFor({state:'visible'});

          await page.getByRole('button', {name:'Поделиться', exact:true}).click();
          const shared = await page.evaluate(() => window.__ottoShared);
          if (!shared || shared.title !== 'OTTO — Zertifikat A1' || shared.url !== base + '/') throw new Error(`Unexpected share payload: ${JSON.stringify(shared)}`);

          await page.getByRole('button', {name:'Написать в поддержку', exact:true}).click();
          await page.getByText('Поддержка OTTO', {exact:true}).waitFor({state:'visible'});
          await page.screenshot({path:'settings-pwa-qa/support-from-settings-mobile.png', fullPage:true});

          await fs.copyFile('public/otto-icon-192.png','settings-pwa-qa/otto-icon-192.png');
          await fs.copyFile('public/otto-icon-512.png','settings-pwa-qa/otto-icon-512.png');
          await fs.writeFile('settings-pwa-qa/results.json', JSON.stringify({manifest,serviceWorker:sw,share:shared,promptCalled}, null, 2));
          await browser.close();
          EOF
          node qa-settings-pwa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-pwa-qa
          path: settings-pwa-qa
          if-no-files-found: warn
