name: Bootstrap archive project

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild uploaded archives
        run: |
          set -euo pipefail
          cat .bootstrap/text-overlay.part1.b64 .bootstrap/text-overlay.part2.b64 > /tmp/text-overlay.b64
          base64 -d /tmp/text-overlay.b64 > /tmp/text-overlay.zip
          unzip -t /tmp/text-overlay.zip

          cat \
            .bootstrap/images/part01.b64 \
            .bootstrap/images/part02.b64 \
            .bootstrap/images/part03.b64 \
            .bootstrap/images/part04.b64 \
            .bootstrap/images/part05.b64 \
            .bootstrap/images/part06.b64 \
            .bootstrap/images/part07.b64 \
            .bootstrap/images/part08.b64 \
            .bootstrap/images/part09.b64 \
            .bootstrap/images/part10.b64 \
            .bootstrap/images/part11.b64 \
            .bootstrap/images/part12.b64 \
            .bootstrap/images/part13a.b64 \
            .bootstrap/images/part13b.b64 \
            .bootstrap/images/part14.b64 \
            > /tmp/otto-main-images.b64
          base64 -d /tmp/otto-main-images.b64 > /tmp/otto-main-images.zip
          echo '6c7489edb736dd447ab9199a21f1d8c63e83e8d12744354f8a320366676e133e  /tmp/otto-main-images.zip' | sha256sum -c -
          unzip -t /tmp/otto-main-images.zip

      - name: Restore verified heavy project base
        run: |
          set -euo pipefail
          git clone https://github.com/chistocrym-wq/-1-.git /tmp/base
          cd /tmp/base
          git checkout 5f4d13e721fa6b05894dabf219860c37ff8938ea
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=.git /tmp/base/ ./

      - name: Apply files from uploaded archive
        run: |
          set -euo pipefail
          unzip -o /tmp/text-overlay.zip -d "$GITHUB_WORKSPACE"

      - name: Restore exact Otto images from uploaded archive
        run: |
          set -euo pipefail
          unzip -o /tmp/otto-main-images.zip -d "$GITHUB_WORKSPACE"
          cat <<'EOF' | sha256sum -c -
          e0bab133d819c6c0ca1ad47a40af691d9f8c6bddfd8072e5ddd7537bb666ee5e  public/otto/otto-home.webp
          55b9ae7765cf22c151655493a2bd5090eaf44827948c043a007e9688dc1cf094  public/otto/otto-guide.webp
          9ded1a163bf91ec8c03e21445f5eca6835738f69fb4ead73f82220d28740be19  public/otto/otto-lesen.webp
          7ced2c2c4e28ccc663a3bf677f695aad81f06130ac36ff4a48534dbec02de41c  public/otto/otto-horen.webp
          EOF

      - name: Create PWA PNG icons
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path('public')
          src = Image.open(root / 'otto' / 'otto-guide.webp').convert('RGBA')
          for n in (192, 512):
              canvas = Image.new('RGBA', (n, n), (17, 141, 132, 255))
              im = src.copy()
              im.thumbnail((int(n * .88), int(n * .88)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(im, ((n-im.width)//2, (n-im.height)//2))
              canvas.save(root / f'otto-icon-{n}.png', optimize=True)
          PY

      - name: Verify project
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build

      - name: Replace bootstrap repository with restored project
        run: |
          set -euo pipefail
          rm -rf .bootstrap .transfer-final-test .transfer-note .transfer-state .transfer-test
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import uploaded Otto A1 project archive"
          git push origin HEAD:main
