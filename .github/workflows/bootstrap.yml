name: Bootstrap archive project

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save archive overlay
        run: |
          set -euo pipefail
          cat .bootstrap/text-overlay.part1.b64 .bootstrap/text-overlay.part2.b64 > /tmp/text-overlay.b64
          base64 -d /tmp/text-overlay.b64 > /tmp/text-overlay.zip
          unzip -t /tmp/text-overlay.zip

      - name: Restore verified heavy project base
        run: |
          set -euo pipefail
          git clone https://github.com/chistocrym-wq/-1-.git /tmp/base
          cd /tmp/base
          git checkout 5f4d13e721fa6b05894dabf219860c37ff8938ea
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=.git /tmp/base/ ./

      - name: Apply files from uploaded archive
        run: |
          set -euo pipefail
          unzip -o /tmp/text-overlay.zip -d "$GITHUB_WORKSPACE"

      - name: Restore Otto image poses
        run: |
          set -euo pipefail
          mkdir -p public/otto
          cd /tmp/base
          git fetch origin otto-photo-preview
          git show origin/otto-photo-preview:public/otto-direct/horen.webp > "$GITHUB_WORKSPACE/public/otto/otto-home.webp"
          git show origin/otto-photo-preview:public/otto-direct/home.webp > "$GITHUB_WORKSPACE/public/otto/otto-guide.webp"
          git show origin/otto-photo-preview:public/otto-direct/lesen.webp > "$GITHUB_WORKSPACE/public/otto/otto-lesen.webp"
          git show origin/otto-photo-preview:public/otto-direct/guide.webp > "$GITHUB_WORKSPACE/public/otto/otto-horen.webp"

      - name: Create PWA PNG icons
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path('public')
          src = Image.open(root / 'otto' / 'otto-guide.webp').convert('RGBA')
          for n in (192, 512):
              canvas = Image.new('RGBA', (n, n), (17, 141, 132, 255))
              im = src.copy()
              im.thumbnail((int(n * .88), int(n * .88)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(im, ((n-im.width)//2, (n-im.height)//2))
              canvas.save(root / f'otto-icon-{n}.png', optimize=True)
          PY

      - name: Verify project
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run build

      - name: Replace bootstrap repository with restored project
        run: |
          set -euo pipefail
          rm -rf .bootstrap .transfer-final-test .transfer-note .transfer-state .transfer-test
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import uploaded Otto A1 project archive"
          git push origin HEAD:main

# retry after exact overlay repair
