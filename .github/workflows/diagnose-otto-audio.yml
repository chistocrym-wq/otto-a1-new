name: Diagnose OTTO Audio Endpoint

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deploy preview
        run: sleep 45
      - name: Read server-side Gemini audio diagnostics
        env:
          BASE: https://deploy-preview-17--otto-a1-new.netlify.app
        run: |
          curl -fsS "$BASE/api/diagnose-sprechen" | tee diagnose.json
          python3 - <<'PY'
          import json
          p=json.load(open('diagnose.json'))
          print(json.dumps(p, ensure_ascii=False, indent=2))
          assert p.get('configured') is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otto-audio-diagnostics
          path: diagnose.json
          retention-days: 3
