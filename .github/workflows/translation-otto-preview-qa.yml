name: Translation OTTO Preview QA

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify short and long mobile translations
        env:
          TARGET_URL: https://deploy-preview-17--otto-a1-new.netlify.app
        run: |
          sleep 55
          cat > qa-translations.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base=process.env.TARGET_URL;
          const browser=await chromium.launch({headless:true});
          fs.mkdirSync('translation-qa',{recursive:true});
          const longText='Это длинный перевод для проверки мобильного окна. Текст должен полностью оставаться доступным, нормально переноситься по словам и прокручиваться по вертикали внутри карточки, не уходя под нижнее меню и не создавая горизонтальную прокрутку. '.repeat(8);

          function assert(cond,msg){if(!cond)throw new Error(msg)}
          async function openHoren(page,mode){
            await page.route('**/api/translate-task',async route=>{
              let body={};try{body=route.request().postDataJSON()||{}}catch{}
              if(body.mode==='explain-pair')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({de:String(body.text||''),ru:'Объяснение'})});
              const parts=Array.isArray(body.parts)?body.parts:[];
              const translations=parts.map((_,i)=>mode==='long'?`${i+1}. ${longText}`:`${i+1}. Короткий перевод.`);
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({translations})});
            });
            await page.goto(base+'/?qa=translation-overflow-'+mode+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('.otto-splash-screen').waitFor({state:'detached',timeout:15000}).catch(()=>{});
            await page.locator('.otto-bottom-nav-item').nth(1).click();
            await page.getByRole('button',{name:/Hören/}).click();
            await page.locator('section').first().waitFor({state:'visible',timeout:10000});
          }
          async function cardEye(page){
            const eye=page.locator('section [data-translation-ui] button[aria-label="Показать перевод"]').first();
            await eye.waitFor({state:'visible',timeout:10000});return eye;
          }
          async function docFits(page,label){
            const d=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            assert(d.sw<=d.cw+1,`${label}: horizontal overflow ${d.sw}>${d.cw}`);
          }
          async function panelFits(page,panel,label){
            const box=await panel.boundingBox();assert(box,`${label}: panel has no box`);
            const viewport=page.viewportSize();assert(viewport,`${label}: viewport missing`);
            assert(box.x>=-1&&box.x+box.width<=viewport.width+1,`${label}: panel outside horizontal viewport`);
            assert(box.y>=-1&&box.y+box.height<=viewport.height+1,`${label}: panel outside vertical viewport`);
            const nav=page.locator('.otto-bottom-nav-inner');
            if(await nav.count()){
              const n=await nav.boundingBox();if(n)assert(box.y+box.height<=n.y+1,`${label}: panel overlaps bottom nav`);
            }
          }

          for(const width of [320,390,430]){
            {
              const context=await browser.newContext({viewport:{width,height:844}});const page=await context.newPage();
              await openHoren(page,'long');await (await cardEye(page)).click();
              const panel=page.locator('section [data-translation-ui] > div.fixed').first();await panel.waitFor({state:'visible'});
              const close=panel.getByRole('button',{name:'Закрыть перевод'});await close.waitFor({state:'visible'});
              const body=panel.locator('div.min-h-0.overflow-y-auto').first();
              const metrics=await body.evaluate(el=>({scrollHeight:el.scrollHeight,clientHeight:el.clientHeight}));
              assert(metrics.scrollHeight>metrics.clientHeight+20,`long ${width}: translation body does not scroll`);
              await panelFits(page,panel,`long ${width}`);await docFits(page,`long ${width}`);
              await page.screenshot({path:`translation-qa/long-top-${width}.png`,fullPage:true});
              await body.evaluate(el=>{el.scrollTop=el.scrollHeight});await page.waitForTimeout(150);
              const bottom=await body.evaluate(el=>Math.abs(el.scrollHeight-el.clientHeight-el.scrollTop));
              assert(bottom<=2,`long ${width}: could not reach translation bottom (${bottom})`);
              assert(await close.isVisible(),`long ${width}: close button disappeared after scroll`);
              const last=body.locator('p').last();const lb=await last.boundingBox();const bb=await body.boundingBox();
              assert(lb&&bb&&lb.y+lb.height>bb.y&&lb.y+lb.height<=bb.y+bb.height+2,`long ${width}: final text edge is not reachable`);
              await page.screenshot({path:`translation-qa/long-bottom-${width}.png`,fullPage:true});
              await close.click();assert(!(await panel.isVisible()),`long ${width}: close did not close translation`);
              await context.close();
            }
            {
              const context=await browser.newContext({viewport:{width,height:844}});const page=await context.newPage();
              await openHoren(page,'short');await (await cardEye(page)).click();
              const panel=page.locator('section [data-translation-ui] > div.fixed').first();await panel.waitFor({state:'visible'});
              await panelFits(page,panel,`short ${width}`);await docFits(page,`short ${width}`);
              const box=await panel.boundingBox();assert(box&&box.height<500,`short ${width}: compact translation is unexpectedly tall`);
              await page.screenshot({path:`translation-qa/short-${width}.png`,fullPage:true});
              await panel.getByRole('button',{name:'Закрыть перевод'}).click();
              await context.close();
            }
          }
          await browser.close();
          NODE
          node qa-translations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-otto-preview-qa
          path: translation-qa
          retention-days: 3
