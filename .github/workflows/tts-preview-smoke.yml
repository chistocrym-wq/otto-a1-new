name: TTS preview smoke

on:
  push:
    branches:
      - preview/major-learning-update-2026-09-17

jobs:
  tts-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose preview OTTO TTS
        shell: bash
        run: |
          set -euo pipefail
          sleep 70
          URL='https://deploy-preview-23--otto-a1-new.netlify.app/api/otto-tts?probe=otto-final-voice-v2&case=normal'
          BODY_FILE=$(mktemp)
          STATUS=$(curl --silent --show-error --max-time 45 --output "$BODY_FILE" --write-out '%{http_code}' "$URL")
          echo "HTTP ${STATUS}"
          cat "$BODY_FILE"
          echo
          test "$STATUS" = '200'
