name: Otto runtime TTS check

on:
  push:
    branches:
      - preview/otto-start-voice-hotfix-2026-09-17

jobs:
  runtime-tts:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview WAV runtime
        shell: bash
        run: |
          set -euo pipefail
          sleep 55
          URL='https://deploy-preview-24--otto-a1-new.netlify.app/api/otto-tts'
          headers=$(mktemp)
          body=$(mktemp)
          status=$(curl --silent --show-error --max-time 90 -G -D "$headers" -o "$body" -w '%{http_code}' \
            --data-urlencode 'text=Ich heiße Otto' \
            --data-urlencode 'mode=normal' \
            --data-urlencode 'kind=text' \
            "$URL")
          content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print $2}' "$headers" | tail -1)
          bytes=$(wc -c < "$body")
          riff=$(xxd -p -l 4 "$body" | tr -d '\n')
          wave=$(dd if="$body" bs=1 skip=8 count=4 2>/dev/null | xxd -p | tr -d '\n')
          provider=$(awk 'BEGIN{IGNORECASE=1} /^x-otto-provider:/{gsub("\r",""); print $2}' "$headers" | tail -1)
          tts=$(awk 'BEGIN{IGNORECASE=1} /^x-otto-tts:/{gsub("\r",""); print $2}' "$headers" | tail -1)
          echo "RUNTIME_HTTP=$status"
          echo "CONTENT_TYPE=$content_type"
          echo "AUDIO_BYTES=$bytes"
          echo "RIFF_MAGIC=$riff"
          echo "WAVE_MAGIC=$wave"
          echo "PROVIDER=$provider"
          echo "TTS_SOURCE=$tts"
          if [ "$status" != '200' ]; then echo 'ERROR_BODY:'; head -c 1200 "$body"; echo; exit 1; fi
          case "$content_type" in audio/wav*) ;; *) echo 'Not audio/wav'; exit 1;; esac
          test "$bytes" -gt 1000
          test "$riff" = '52494646'
          test "$wave" = '57415645'
