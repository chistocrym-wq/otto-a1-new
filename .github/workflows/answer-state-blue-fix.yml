name: Apply True Pale Blue Answer State

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/master-roadmap-final-46-52
          fetch-depth: 0
      - name: Change only pre-check selected answer color
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('src/components/modules/ReadingModule.tsx'),
              Path('src/components/modules/ListeningModule.tsx'),
          ]
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count('border-sky-400 bg-sky-50')
              if count < 1:
                  raise SystemExit(f'Expected selected-state class not found in {path}')
              text = text.replace('border-sky-400 bg-sky-50', 'border-blue-300 bg-blue-50')
              path.write_text(text)
              total += count
          if total != 3:
              raise SystemExit(f'Expected exactly 3 selected-state replacements, got {total}')
          PY
      - name: Commit narrow color fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/modules/ReadingModule.tsx src/components/modules/ListeningModule.tsx
          git commit -m "Use true pale blue for Lesen and Horen selections"
          git push origin HEAD:task/master-roadmap-final-46-52
