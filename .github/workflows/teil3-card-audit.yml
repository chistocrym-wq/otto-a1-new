name: Teil 3 Card Audit

on:
  push:
    branches:
      - task/master-roadmap-final-46-52

jobs:
  contact-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build contact sheets from original cards
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          source = Path('public/sprechen/teil3-originals')
          out = Path('teil3-card-audit')
          out.mkdir(exist_ok=True)
          font = ImageFont.load_default(size=28)
          cell_w, cell_h = 520, 570
          cols, rows = 4, 2

          for sheet_idx in range(6):
              canvas = Image.new('RGB', (cols * cell_w, rows * cell_h), 'white')
              draw = ImageDraw.Draw(canvas)
              for slot in range(8):
                  card_no = sheet_idx * 8 + slot + 1
                  if card_no > 48:
                      break
                  path = source / f'CARD ({card_no}).png'
                  img = Image.open(path).convert('RGB')
                  img.thumbnail((500, 500), Image.Resampling.LANCZOS)
                  x0 = (slot % cols) * cell_w
                  y0 = (slot // cols) * cell_h
                  x = x0 + (cell_w - img.width) // 2
                  y = y0 + 50 + (500 - img.height) // 2
                  canvas.paste(img, (x, y))
                  draw.rectangle((x0, y0, x0 + cell_w - 1, y0 + cell_h - 1), outline='black', width=2)
                  draw.text((x0 + 12, y0 + 10), f'CARD {card_no}', fill='black', font=font)
              canvas.save(out / f'cards-{sheet_idx * 8 + 1:02d}-{min(sheet_idx * 8 + 8,48):02d}.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: teil3-card-audit
          path: teil3-card-audit
          retention-days: 3
