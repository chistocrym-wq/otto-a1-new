<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>OTTO A1 — Preview</title>
<style>
:root{--teal:#079ba5;--teal-dark:#087f89;--navy:#07183c;--muted:#375675;--bg:#f4fcfd;--navh:72px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--navy);background:#e9fbfb}button{font:inherit;color:inherit;border:0}
body{display:flex;justify-content:center;background:linear-gradient(180deg,#e9fbfb 0,#f7fdfd 55%,#e9fafa 100%)}
.app{position:relative;width:min(100%,430px);min-height:100dvh;background:linear-gradient(180deg,#f4fcfd 0,#fbfefe 100%);padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom));overflow-x:hidden;box-shadow:0 0 34px rgba(17,78,86,.08)}
.hero{position:relative;height:278px;overflow:hidden;background:linear-gradient(180deg,#a8ecf6 0%,#d7f8f6 58%,#d9f4e8 100%)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.08) 40%,rgba(255,255,255,0) 70%)}
.hero-copy{position:absolute;z-index:5;left:25px;top:25px;width:205px}
.brand{position:relative;display:inline-flex;flex-direction:column;font-weight:950;line-height:.84;letter-spacing:-.055em}.brand-prefix{font-size:33px}.brand-name{font-size:58px;margin-top:3px}.swoosh{position:absolute;left:0;bottom:-13px;width:168px;height:16px;border-top:5px solid #06a7aa;border-radius:50%;transform:rotate(-1deg)}
.hero h1{margin:27px 0 0;font-size:19px;line-height:1;font-weight:900;letter-spacing:-.02em}.hero p{margin:5px 0 0;font-size:11.5px;line-height:1.15;font-weight:570}.encourage{position:absolute;z-index:6;left:31px;top:180px;color:#087f89;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:19px;font-weight:800;line-height:1.05;transform:rotate(-5deg);white-space:pre-line}
.otto{position:absolute;z-index:4;right:-19px;top:22px;width:250px;height:auto;mix-blend-mode:multiply;filter:drop-shadow(0 8px 12px rgba(31,61,70,.1))}
.progress{position:relative;z-index:8;margin:0 14px;background:rgba(255,255,255,.98);border-radius:18px;padding:14px 15px 13px;box-shadow:0 10px 26px rgba(11,86,96,.11)}.progress-row{display:flex;align-items:center;gap:12px}.progress-icon{width:52px;height:52px;flex:0 0 52px;border-radius:50%;display:grid;place-items:center;background:#ddf9f8;color:#05a4aa}.progress-icon svg{width:32px;height:32px}.progress-main{min-width:0;flex:1}.progress-head{display:flex;justify-content:space-between;align-items:baseline}.progress-head strong{font-size:22px;font-weight:950;letter-spacing:-.03em}.progress-head b{font-size:20px;color:#0aa8ad}.bar{height:9px;border-radius:99px;background:#dceff1;margin-top:8px;overflow:hidden}.bar>i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#0ab7bb,#04a2a9);border-radius:99px}.stats{display:flex;justify-content:space-between;gap:9px;margin-top:10px;color:#244663;font-size:10.5px}.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}.stat svg{width:15px;height:15px;color:#0aa8ad}
.section{padding:0 14px;margin-top:20px}.section h2{margin:0 0 12px;font-size:22px;line-height:1;font-weight:950;letter-spacing:-.035em}.modules{display:grid;grid-template-columns:1fr 1fr;gap:8px}.module{min-height:87px;border-radius:18px;display:flex;align-items:center;padding:12px 12px;gap:8px;text-align:left;box-shadow:0 6px 18px rgba(17,66,74,.035)}.sch{background:#fff0eb}.spr{background:#e5fbf5}.les{background:#fff7df}.hor{background:#efedff}.mi{width:45px;height:45px;flex:0 0 45px;color:#078493;display:grid;place-items:center}.mi svg{width:42px;height:42px}.mc{min-width:0;flex:1}.mc strong{display:block;font-size:16px;line-height:1;font-weight:900}.mc small{display:block;margin-top:6px;font-size:12px;color:#2e6880}.chev{font-size:31px;line-height:1;color:#087b88;font-weight:300}
.exam{margin:13px 14px 0;min-height:83px;border-radius:18px;background:linear-gradient(90deg,#e3fbfb,#dff8f8);display:grid;grid-template-columns:54px 1fr 87px;align-items:center;gap:9px;padding:11px 12px}.exam-icon{width:48px;height:48px;color:#05a8ad}.exam-icon svg{width:48px;height:48px}.exam-copy strong{display:block;font-size:17px;font-weight:950;line-height:1.05}.exam-copy small{display:block;margin-top:5px;color:#168da0;font-size:10.5px;line-height:1.2}.exam-btn{height:42px;border-radius:13px;color:white;background:linear-gradient(135deg,#0a9ca7,#087e88);font-size:14px;font-weight:850}
.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.material{min-height:105px;border-radius:17px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9px 5px;box-shadow:0 7px 17px rgba(14,69,79,.05)}.material .icon{width:35px;height:35px;color:#087f8c}.material .icon svg{width:35px;height:35px}.material strong{font-size:12px;margin-top:5px;font-weight:900}.material small{font-size:9px;line-height:1.15;color:#3c5d7a;margin-top:4px}
.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.98);border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(11,64,72,.09);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;color:#334e70;padding:0}.nav button.active{color:#067f8d;font-weight:800}.nav svg{width:22px;height:22px}.nav .active::after{content:"";position:absolute;bottom:3px;width:44px;height:4px;border-radius:99px;background:#0aa9ad}
@media(min-width:431px){.app{margin:18px 0;border-radius:30px;min-height:calc(100dvh - 36px)}.nav{bottom:18px;border-radius:22px}.hero{border-radius:30px 30px 0 0}}
@media(max-width:360px){.hero{height:258px}.hero-copy{left:19px;top:21px;width:185px}.brand-prefix{font-size:29px}.brand-name{font-size:51px}.swoosh{width:150px}.hero h1{margin-top:25px;font-size:17px}.hero p{font-size:10.5px}.encourage{left:25px;top:171px;font-size:17px}.otto{width:229px;right:-23px;top:24px}.progress{margin:0 9px}.section{padding:0 9px}.exam{margin-left:9px;margin-right:9px}.module{padding:10px 8px}.mi{width:39px;flex-basis:39px}.mi svg{width:38px;height:38px}.mc strong{font-size:14px}.mc small{font-size:11px}.exam{grid-template-columns:48px 1fr 78px}.exam-btn{font-size:13px}.stats{font-size:9.5px}.material strong{font-size:11px}.material small{font-size:8px}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">

      <rect width="430" height="278" fill="#b5eef5"/>
      <g fill="#fff" opacity=".8"><ellipse cx="66" cy="38" rx="48" ry="17"/><ellipse cx="116" cy="47" rx="42" ry="16"/><ellipse cx="340" cy="34" rx="46" ry="17"/></g>
      <rect y="145" width="430" height="133" fill="url(#water)"/>
      <g opacity=".95"><path d="M272 104h170v14H272z" fill="#d7cbb8"/><path d="M274 118h11v51h-11zm45 0h11v51h-11zm45 0h11v51h-11zm45 0h11v51h-11z" fill="#bea987"/><path d="M285 169q17-35 34 0m11 0q17-35 34 0m11 0q17-35 34 0" fill="none" stroke="#bea987" stroke-width="8"/></g>
      <g><path d="M298 73h18v45h-18zM323 63h18v55h-18zM350 78h18v40h-18zM378 70h18v48h-18z" fill="#f0c17e"/><path d="M300 73l7-20 7 20M325 63l7-29 7 29M352 78l7-18 7 18M380 70l7-25 7 25" fill="#2b7f9c"/><rect x="286" y="102" width="126" height="16" fill="#e5a968"/></g>
      <g fill="#74bd82"><circle cx="24" cy="114" r="38"/><circle cx="55" cy="128" r="32"/><circle cx="414" cy="121" r="42"/><circle cx="385" cy="135" r="31"/></g>

      <h1>Zertifikat A1</h1><p>Подготовка шаг за шагом</p><p>Подготовимся к экзамену вместе</p>
    </div>
    <div class="encourage">Du<br>schaffst<br>das! ♡</div>
    <img class="otto" src="public/otto/otto-home-documents.webp" alt="OTTO">
  </section>

  <section class="progress">
    <div class="progress-row"><div class="progress-icon"><svg viewBox="0 0 64 64"><rect x="10" y="37" width="10" height="17" rx="2" fill="currentColor"/><rect x="27" y="27" width="10" height="27" rx="2" fill="currentColor"/><rect x="44" y="14" width="10" height="40" rx="2" fill="currentColor"/></svg></div><div class="progress-main"><div class="progress-head"><strong>Мой прогресс</strong><b>60%</b></div><div class="bar"><i></i></div><div class="stats"><span class="stat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.5 12 3 3 6-7" fill="none" stroke="white" stroke-width="2.2"/></svg>36 из 60 заданий выполнено</span><span class="stat"><svg viewBox="0 0 24 24"><path d="M8 4h8v5c0 4-2 6-4 6s-4-2-4-6V4Z" fill="currentColor"/><path d="M12 15v5M8 21h8" stroke="currentColor" stroke-width="2"/><path d="M8 6H4v2c0 3 2 5 5 5M16 6h4v2c0 3-2 5-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>4 из 8 тем пройдено</span></div></div></div>
  </section>

  <section class="section"><h2>Выберите модуль</h2><div class="modules">
    <button class="module sch"><span class="mi"><svg viewBox="0 0 64 64"><path d="M13 47 17 33 44 6a6 6 0 0 1 9 0l5 5a6 6 0 0 1 0 9L31 47l-15 4Z" fill="currentColor"/></svg></span><span class="mc"><strong>Schreiben</strong><small>Письмо</small></span><span class="chev">›</span></button>

    <button class="module les"><span class="mi"><svg viewBox="0 0 64 64"><path d="M7 12c9-3 17-1 25 5v35c-8-6-16-8-25-5V12Zm50 0c-9-3-17-1-25 5v35c8-6 16-8 25-5V12Z" fill="none" stroke="currentColor" stroke-width="4"/><path d="M32 17v35" stroke="currentColor" stroke-width="4"/></svg></span><span class="mc"><strong>Lesen</strong><small>Чтение</small></span><span class="chev">›</span></button>
    <button class="module hor"><span class="mi"><svg viewBox="0 0 64 64"><path d="M11 35v-6C11 17 20 8 32 8s21 9 21 21v6" fill="none" stroke="currentColor" stroke-width="5"/><rect x="7" y="31" width="11" height="22" rx="5" fill="currentColor"/><rect x="46" y="31" width="11" height="22" rx="5" fill="currentColor"/></svg></span><span class="mc"><strong>Hören</strong><small>Аудирование</small></span><span class="chev">›</span></button>
  </div></section>

  <section class="exam"><span class="exam-icon"><svg viewBox="0 0 64 64"><rect x="13" y="11" width="38" height="46" rx="5" fill="currentColor"/><rect x="23" y="6" width="18" height="10" rx="4" fill="#fff"/><path d="m21 29 4 4 7-8M21 42l4 4 7-8" fill="none" stroke="#fff" stroke-width="3"/><path d="M36 29h9M36 42h9" stroke="#fff" stroke-width="3"/></svg></span><span class="exam-copy"><strong>Пробный экзамен</strong><small>Проверьте свои знания<br>в формате настоящего экзамена</small></span><button class="exam-btn">Начать ›</button></section>

  <section class="section"><h2>Полезные материалы</h2><div class="materials">

    <button class="material"><span class="icon"><svg viewBox="0 0 64 64"><rect x="10" y="9" width="40" height="46" rx="4" fill="currentColor"/><path d="M18 19h24v10H18z" fill="#fff"/><path d="M18 36h10M18 43h10M34 36h8M34 43h8" stroke="#fff" stroke-width="3"/></svg></span><strong>Новости</strong><small>Актуальная информация</small></button>
  </div></section>

  <button><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M9.8 9a2.5 2.5 0 1 1 4.5 1.5c-.9 1-2.3 1.3-2.3 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="#fff"/></svg><span>Поддержка</span></button>
